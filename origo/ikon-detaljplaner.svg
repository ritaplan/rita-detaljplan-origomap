<?xml version="1.0" encoding="UTF-8"?>
<!-- Ikon för lagret Detaljplaner i Origos lagerlista: en liten plankarta med två användningsytor, prickmark och
     planområdesgräns (streckprickad). Enkel med flit: den visas i bara 20–36 px. Kan ritas om fritt. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Detaljplaner">
  <rect width="48" height="48" rx="10" fill="#ffffff"/>
  <g transform="rotate(-16 24 24)">
    <rect x="7" y="8" width="17" height="32" fill="#f2da5e"/>
    <rect x="24" y="8" width="17" height="32" fill="#cfa766"/>
    <g fill="#1f2933">
      <circle cx="12" cy="16" r="1.8"/><circle cx="12" cy="24" r="1.8"/><circle cx="12" cy="32" r="1.8"/>
      <circle cx="19" cy="20" r="1.8"/><circle cx="19" cy="28" r="1.8"/>
    </g>
    <rect x="7" y="8" width="34" height="32" fill="none" stroke="#1f2933" stroke-width="3.4" stroke-dasharray="9 3 3 3"
          stroke-linejoin="round"/>
  </g>
</svg>
