<?xml version="1.0" encoding="UTF-8"?>
<!-- Ikon för lagret Detaljplaner i Origos lagerlista: en liten plankarta med användningsytor, prickmark och
     planområdesgräns (streckprickad). Kan ritas om fritt: den visas i ungefär 36 px. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Detaljplaner">
  <rect width="48" height="48" rx="10" fill="#ffffff"/>
  <g transform="rotate(-18 24 24)">
    <rect x="8" y="9" width="14" height="30" fill="#f4e27a"/>
    <rect x="22" y="9" width="18" height="30" fill="#d9b985"/>
    <rect x="22" y="9" width="4" height="30" fill="#c7cfd6"/>
    <g fill="#1f2933">
      <circle cx="11.5" cy="14" r="0.9"/><circle cx="11.5" cy="19" r="0.9"/><circle cx="11.5" cy="24" r="0.9"/>
      <circle cx="11.5" cy="29" r="0.9"/><circle cx="11.5" cy="34" r="0.9"/>
      <circle cx="15.5" cy="16.5" r="0.9"/><circle cx="15.5" cy="21.5" r="0.9"/><circle cx="15.5" cy="26.5" r="0.9"/>
      <circle cx="15.5" cy="31.5" r="0.9"/>
    </g>
    <rect x="8" y="9" width="32" height="30" fill="none" stroke="#1f2933" stroke-width="2.4" stroke-dasharray="7 2.2 2 2.2"
          stroke-linejoin="round"/>
  </g>
</svg>
