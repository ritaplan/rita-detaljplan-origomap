# Webbservern i behållaren web: exempelkartan (exempelkarta/) och vidarebefordran till karttjänsterna.
# Din egen webbserver skickar /planmosaik/ hit (nginx/varden/); sökvägarna nedan är relativa till det.
# Använder du bara en av tjänsterna: ta bort den andras location-block.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # GeoServers administration och REST nås bara via SSH-tunnel till 127.0.0.1:8081, aldrig härifrån.
    location ~ ^/geoserver/(web|rest|j_spring_security_check) {
        return 403;
    }
    location /geoserver/ {
        proxy_pass http://geoserver:8080/geoserver/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Prefix /planmosaik;
    }

    # QGIS Server: projektet väljs av servern (QGIS_PROJECT_FILE), anropet kan inte peka på någon annan fil.
    location /qgis/ {
        proxy_pass http://qgis-server:80/ows/;
        proxy_set_header Host $http_host;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
