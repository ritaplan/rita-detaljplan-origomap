# Din webbserver (nginx): skickar /geoserver/ vidare till GeoServer (127.0.0.1:8081, GEOSERVER_ADMIN_PORT i .env), så att
# din Origo-karta kan läsa detaljplanerna från samma adress som själva kartan. Det här är vad en kommun med en egen
# Origo-karta behöver. Läggs in i server-blocket för HTTPS (med en include-rad: se installera.sh).
#
# GeoServers administration och REST-gränssnitt släpps INTE ut: de når du bara från servern själv (SSH-tunnel).
location ~ ^/geoserver/(web|rest|j_spring_security_check|gwc/rest) {
    return 403;
}

location /geoserver/ {
    # Begränsa antalet anrop per IP om din server har en zon för det (limit_req_zone i http-blocket), till exempel:
    #   limit_req zone=api_per_ip burst=100 nodelay;
    #   limit_req_status 429;

    proxy_pass http://127.0.0.1:8081/geoserver/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
}
