# Din webbserver (nginx): skickar /planmosaik/ vidare till webbbehållaren (127.0.0.1:8090, WEB_PORT i .env), som serverar
# exempelkartan och vidarebefordrar till GeoServer (/geoserver/) och QGIS Server (/qgis/).
# Läggs in i server-blocket för HTTPS (med en include-rad: se installera.sh och docs/kom-igang.md).
# Sökvägen /planmosaik/ är den som exempelkartan och nginx/web.conf är gjorda för: byter du den, byt den överallt.
location = /planmosaik {
    return 301 /planmosaik/;
}

location /planmosaik/ {
    # Begränsa antalet anrop per IP om din server har en zon för det (limit_req_zone i http-blocket), till exempel:
    #   limit_req zone=api_per_ip burst=100 nodelay;
    #   limit_req_status 429;

    proxy_pass http://127.0.0.1:8090/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
