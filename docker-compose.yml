# Detaljplaner i en webbkarta: två karttjänster och en webbserver för exempelkartan.
#
#   GeoServer    -> WMS, WFS och vektorrutor (/geoserver/...)
#   QGIS Server  -> WMS och WFS              (/qgis/...)
#   web (nginx)  -> exempelkartan (Origo) och vidarebefordran till de två tjänsterna
#
# Du behöver inte köra båda tjänsterna: ta bort den du inte vill ha (och dess rad under depends_on och i nginx/web.conf).
# Båda läser databasen med den skrivskyddade rollen karta_ro. Alla inställningar (databasens adress, nätverk, portar,
# versioner) står i .env: kopiera .env.exempel och ändra. Lösenorden skapas av databas/skapa_roll.sh och forbered.sh.
# Minnesgränserna är satta för en liten server (4 GB) som också kör annat: höj dem om du har gott om minne.
name: planmosaik

services:
  geoserver:
    image: ${GEOSERVER_IMAGE:-docker.osgeo.org/geoserver:3.0.2}
    container_name: planmosaik-geoserver
    restart: unless-stopped
    environment:
      GEOSERVER_ADMIN_USER: admin
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD}
      SKIP_DEMO_DATA: "true"
      EXTRA_JAVA_OPTS: ${GEOSERVER_JAVA_OPTS:--Xms128m -Xmx640m}
      # Tillägget vectortiles (vektorrutor, MVT) hämtas vid första starten ur GeoServers officiella nedladdningar
      INSTALL_EXTENSIONS: "true"
      STABLE_EXTENSIONS: vectortiles
    volumes:
      - geoserver_data:/opt/geoserver_data
    ports:
      # Administrationen nås bara från den här datorn (SSH-tunnel), aldrig via webben
      - "127.0.0.1:${GEOSERVER_ADMIN_PORT:-8081}:8080"
    mem_limit: ${GEOSERVER_MEMORY:-1g}
    networks: [default, db]

  qgis-server:
    image: ${QGIS_SERVER_IMAGE:-qgis/qgis-server:4.2.3-resolute}
    container_name: planmosaik-qgis
    restart: unless-stopped
    environment:
      QGIS_PROJECT_FILE: /io/data/planmosaik.qgs
      QGIS_SERVER_MAX_THREADS: "2"
    volumes:
      - ./qgis:/io/data:ro
      # Systemplatsen för tjänstedefinitioner: FastCGI-processerna ärver inte miljövariabeln PGSERVICEFILE
      - ./qgis/pg_service.conf:/etc/postgresql-common/pg_service.conf:ro
    mem_limit: ${QGIS_SERVER_MEMORY:-512m}
    networks: [default, db]

  web:
    image: nginx:alpine
    container_name: planmosaik-web
    restart: unless-stopped
    volumes:
      - ./nginx/web.conf:/etc/nginx/conf.d/default.conf:ro
      - ./exempelkarta:/usr/share/nginx/html:ro
      # Planmosaikens egna filer för Origo, så som de ska ligga i din egen karta: se docs/origo.md
      - ./origo:/usr/share/nginx/html/detaljplaner:ro
    ports:
      - "127.0.0.1:${WEB_PORT:-8090}:80"
    mem_limit: 64m
    depends_on: [geoserver, qgis-server]

volumes:
  geoserver_data:

networks:
  # Dockernätverket där databasen nås (docker network ls). Står i .env som DB_NETWORK.
  db:
    external: true
    name: ${DB_NETWORK:-postgis_default}
